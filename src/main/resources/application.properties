spring.application.name=ms-barriodigital-rabbit-admin

server.port=${SERVER_PORT:8086}

# ============================================================
# RabbitMQ
# ============================================================

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:barrio}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:barrio123}

# El servicio administra RabbitMQ de forma explícita mediante RabbitAdmin.
spring.rabbitmq.dynamic=true